name: Issue Lifecycle Sync

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    # Activation prerequisite: engineering-playbook v1.0.0 must exist as a
    # protected immutable release and private Actions access must be verified.
    uses: Plimmerton-Labs/engineering-playbook/.github/workflows/reusable-issue-lifecycle-sync.yml@v1.0.0
